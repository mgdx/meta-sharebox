# ShareBox HTTP front end (lighttpd).
#
# Layout (docs/ARCHITECTURE.md):
# - /run/sharebox/lighttpd-runtime.conf (written by sharebox-setup) is
#   included first: it defines var.sharebox_hostname, var.sharebox_addr,
#   var.sharebox_host_regex, var.sharebox_lang, var.sharebox_upload_max,
#   server.max-request-size and the Accept-Language negotiation of "/".
# - /etc/lighttpd/conf.d/*.conf: captive portal (10-captive.conf) and engine
#   snippets (50-<name>.conf). Snippets never load modules.
# No TLS, no Lua, no access log (no client history on the box).

server.modules = (
    "mod_rewrite",
    "mod_redirect",
    "mod_alias",
    "mod_access",
    "mod_setenv",
    "mod_indexfile",
    "mod_webdav",
    "mod_cgi",
    "mod_proxy",
    "mod_staticfile",
)

server.port = 80
server.bind = "0.0.0.0"
server.use-ipv6 = "disable"
server.document-root = "/usr/share/sharebox/www"
server.tag = "ShareBox"
server.max-connections = 256
server.max-keep-alive-idle = 15
server.max-read-idle = 60
server.max-write-idle = 360
server.follow-symlink = "enable"
# Large uploads are streamed to the engines, not buffered on disk first
server.stream-request-body = 2
server.stream-response-body = 2
server.upload-dirs = ( "/var/tmp" )
server.errorlog-use-syslog = "disable"

index-file.names = ( "index.html" )
# No directory listings: mod_dirlisting is not loaded
url.access-deny = ( "~", ".in", ".inc", ".orig", ".swp" )
static-file.exclude-extensions = ( ".cgi", ".sh" )
etag.use-inode = "disable"

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".htm"  => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "text/javascript; charset=utf-8",
    ".mjs"  => "text/javascript; charset=utf-8",
    ".json" => "application/json",
    ".txt"  => "text/plain; charset=utf-8",
    ".md"   => "text/plain; charset=utf-8",
    ".xml"  => "application/xml",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif"  => "image/gif",
    ".webp" => "image/webp",
    ".ico"  => "image/x-icon",
    ".woff2" => "font/woff2",
    ".wasm" => "application/wasm",
    ".pdf"  => "application/pdf",
    ".epub" => "application/epub+zip",
    ".mp3"  => "audio/mpeg",
    ".ogg"  => "audio/ogg",
    ".opus" => "audio/ogg",
    ".mp4"  => "video/mp4",
    ".webm" => "video/webm",
    ".zip"  => "application/zip",
    ".zim"  => "application/octet-stream",
    ""      => "application/octet-stream",
)

setenv.set-response-header = (
    "X-Content-Type-Options" => "nosniff",
    "X-Frame-Options" => "SAMEORIGIN",
    "Referrer-Policy" => "no-referrer",
)

# Runtime values first, so that the snippets can use the variables
include "/run/sharebox/lighttpd-runtime.conf"

# /status: small shell CGI, no interpreter beyond /bin/sh
$HTTP["url"] == "/status/" {
    url.redirect = ( "^/status/(.*)$" => "/status$1" )
    url.redirect-code = 302
}
$HTTP["url"] == "/status" {
    alias.url = ( "/status" => "/usr/lib/sharebox/cgi-bin/status" )
    cgi.assign = ( "" => "" )
    cgi.execute-x-only = "enable"
}

# Shared and uploaded files are public and anonymous: never let a browser
# run them in the context of the box. Active content is downloaded, not
# rendered, and is sandboxed if it is rendered anyway.
$HTTP["url"] =~ "^/(files|upload)/" {
    $HTTP["url"] =~ "(?i)\.(html?|xhtml|shtml|svgz?|xml|xsl|js|mjs|htc|swf|pdf|exe|msi|bat|cmd|com|scr|ps1|vbs|jar|apk|sh|php|pl|py|cgi)$" {
        setenv.set-response-header = (
            "X-Content-Type-Options" => "nosniff",
            "Content-Disposition" => "attachment",
            "Content-Security-Policy" => "sandbox",
            "Referrer-Policy" => "no-referrer",
        )
    }
}

include "/etc/lighttpd/conf.d/*.conf"
