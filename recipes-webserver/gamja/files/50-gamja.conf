# gamja (modular engine): static web IRC client served at /chat/
# Shipped by gamja-lighttpd, included by /etc/lighttpd/lighttpd.conf.
# Needs mod_alias and mod_redirect (built in, but must still be listed) in
# server.modules of the main config. The WebSocket at /socket is proxied by
# the ergo-lighttpd snippet.
url.redirect += ( "^/chat$" => "/chat/" )
alias.url += ( "/chat/" => "/usr/share/gamja/" )
