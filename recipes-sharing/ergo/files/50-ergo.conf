# Ergo (modular engine): IRC over WebSocket at /socket, used by gamja.
# Shipped by ergo-lighttpd, included by /etc/lighttpd/lighttpd.conf.
# Needs mod_proxy in server.modules of the main config.
$HTTP["url"] == "/socket" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8097 ) ) )
    # Pass the WebSocket upgrade through and keep the tunnel open. lighttpd
    # sends X-Forwarded-For, which Ergo trusts from localhost
    # (server.proxy-allowed-from) for its per-client connection limits.
    proxy.header = ( "upgrade" => "enable" )
    # Ergo pings idle clients every 90 s and gamja pings every 60 s: allow
    # longer idle periods than the lighttpd default (60 s) on this tunnel.
    server.max-read-idle = 600
    server.max-write-idle = 600
}
