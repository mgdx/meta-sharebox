# dufs (modular engine): public share and anonymous upload under /files/
# Shipped by dufs-lighttpd, included by /etc/lighttpd/lighttpd.conf.
# Needs mod_proxy and mod_setenv (built in, but must still be listed) in
# server.modules of the main config.
$HTTP["url"] =~ "^/files(/|$)" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 5000 ) ) )
    # Stream request and response bodies instead of buffering them in
    # temporary files: the rootfs is read-only and uploads can be several GB.
    # WebDAV methods and resumable uploads (PATCH) are passed through as is.
    server.stream-request-body = 2
    server.stream-response-body = 2
    setenv.add-response-header += ( "X-Content-Type-Options" => "nosniff" )
}
