# dufs (full engine): anonymous upload directory under /upload/
# Shipped by dufs-upload-lighttpd, included by /etc/lighttpd/lighttpd.conf.
# dufs.service switches to --path-prefix /upload when SHAREBOX_ENGINE=full.
# Needs mod_proxy and mod_setenv (built in, but must still be listed) in
# server.modules of the main config.
$HTTP["url"] =~ "^/upload(/|$)" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 5000 ) ) )
    # Stream bodies: no temporary files on the read-only rootfs
    server.stream-request-body = 2
    server.stream-response-body = 2
    setenv.add-response-header += ( "X-Content-Type-Options" => "nosniff" )
}
