# dufs-ro (library and full engines): read-only public share under /files/
# Shipped by dufs-ro-lighttpd, included by /etc/lighttpd/lighttpd.conf.
# Mutually exclusive with dufs-lighttpd (same URL). Needs mod_proxy and
# mod_setenv (built in, but must still be listed) in server.modules.
$HTTP["url"] =~ "^/files(/|$)" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 5001 ) ) )
    server.stream-response-body = 2
    setenv.add-response-header += ( "X-Content-Type-Options" => "nosniff" )
}
