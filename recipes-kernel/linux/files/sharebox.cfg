# ShareBox kernel features

# Firewall: nftables with NAT redirect and reject
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_NAT=m
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=m
CONFIG_NFT_LIMIT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_REDIR=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_REJECT_INET=m

# Read-only root file system and overlays (built in: needed before modules)
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_XATTR=y
CONFIG_EROFS_FS_ZIP=y
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_EXT4_FS=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS=y

# USB sticks (vfat is built in: the boot partition is mounted on /boot for
# the U-Boot environment, see sharebox-storage.cfg)
CONFIG_EXFAT_FS=m
CONFIG_NTFS3_FS=m
CONFIG_VFAT_FS=y
CONFIG_NLS_UTF8=m
CONFIG_NLS_CODEPAGE_437=m
CONFIG_NLS_ISO8859_1=m

# Integrity of the rootfs slots (optional SHAREBOX_VERITY) and RAUC bundles
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_BLK_DEV_LOOP=y

# Headless access point: no Bluetooth, sound, display or camera
# CONFIG_BT is not set
# CONFIG_SOUND is not set
# CONFIG_SND is not set
# CONFIG_DRM is not set
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_INPUT_JOYSTICK is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_NFC is not set
# CONFIG_CAN is not set
# CONFIG_HAMRADIO is not set
