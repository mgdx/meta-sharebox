# ShareBox storage: needed before any module can be loaded (no initramfs)
# erofs root filesystem, lz4 compressed
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_ZIP=y
# /etc and /var overlays mounted by the preinit
CONFIG_OVERLAY_FS=y
# RAM-backed overlay fallback needs trusted.* xattrs on tmpfs
CONFIG_TMPFS=y
CONFIG_TMPFS_XATTR=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
# RAUC verity bundles: squashfs payload on loop + dm-verity (modules are fine,
# they are loaded on demand)
CONFIG_BLK_DEV_LOOP=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=m
CONFIG_DM_VERITY=m
CONFIG_SQUASHFS=m
CONFIG_SQUASHFS_XZ=y
CONFIG_CRYPTO_SHA256=y
