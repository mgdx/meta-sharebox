header:
  version: 14

distro: sharebox
target: sharebox-image-base

repos:
  meta-sharebox:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: 6e260eb6ab1631607ea414d9ff8ede1155faa5d9
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: 636e5d3b12d54951c13d57346648bc29a0e6b24e
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-rauc:
    url: https://github.com/rauc/meta-rauc
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

local_conf_header:
  sharebox-common: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INHERIT += "rm_work"
    BB_NUMBER_THREADS ?= "8"
    PARALLEL_MAKE ?= "-j 12"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
