# meta-sharebox: offline file-sharing box distro and recipes
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sharebox"
BBFILE_PATTERN_meta-sharebox = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sharebox = "10"

LAYERVERSION_meta-sharebox = "1"
LAYERSERIES_COMPAT_meta-sharebox = "wrynose blacksail"

LAYERDEPENDS_meta-sharebox = " \
    core \
    openembedded-layer \
    networking-layer \
    filesystems-layer \
    raspberrypi \
    rauc \
"
LAYERRECOMMENDS_meta-sharebox = "multimedia-layer"

# Only apply bbappends for layers that are actually present
BBFILES_DYNAMIC += " \
    multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/*/*/*.bb \
    multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/*/*/*.bbappend \
"
