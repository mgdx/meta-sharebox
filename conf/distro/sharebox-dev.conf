# ShareBox development distro: production distro plus debug access
#
# Adds, on top of the production distro:
# - dropbear SSH server, public key authentication only (no password login),
#   reachable on Ethernet / USB gadget only: the firewall never opens port 22
#   on wlan0 (see sharebox-config-dev).
# - serial console with a root login (empty root password, UART only, since
#   SSH refuses passwords).
# Wrynose has no "debug-tweaks" any more; its replacement features are
# listed explicitly. allow-empty-password is not used: SSH stays key-only.
require conf/distro/sharebox.conf

DISTRO = "sharebox-dev"
DISTRO_NAME = "ShareBox (development)"

SHAREBOX_DEV = "1"

ENABLE_UART:rpi = "1"
SERIAL_CONSOLES:rpi = "${SERIAL_CONSOLES_DEV}"
SERIAL_CONSOLES_DEV ?= "115200;ttyS0"
SERIAL_CONSOLES_DEV:raspberrypi5 ?= "115200;ttyAMA10"

EXTRA_IMAGE_FEATURES:append = " ssh-server-dropbear empty-root-password allow-root-login post-install-logging"
