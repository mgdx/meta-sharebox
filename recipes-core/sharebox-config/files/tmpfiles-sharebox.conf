# ShareBox persistent data tree on the /data partition and runtime directory.
# Directories owned by engine specific users (/data/chat for ergo, /data/zim
# for kiwix) are created by the engine recipes themselves.
d /run/sharebox            0755 root     root     -
d /data/config             0755 root     root     -
d /data/var                0755 root     root     -
d /data/share              0755 sharebox sharebox -
d /data/share/upload       0755 sharebox sharebox -
d /data/forum              0750 sharebox sharebox -
