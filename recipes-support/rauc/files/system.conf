# RAUC system configuration for ShareBox (installed by rauc-conf as
# /usr/lib/rauc/system.conf, @@TOKENS@@ replaced at build time).
# Derived from meta-rauc-raspberrypi recipes-core/rauc/files/system.conf (MIT).
#
# Two erofs root filesystem slots written raw, U-Boot BOOT_ORDER /
# BOOT_x_LEFT boot selection, signed verity bundles only. The data partition
# is never a slot.

[system]
compatible=@@COMPATIBLE@@
bootloader=uboot
boot-attempts=3
boot-attempts-primary=3
bundle-formats=verity
# The root filesystem is read-only: mount bundles under /run, keep the
# status files on /data.
mountprefix=/run/rauc
data-directory=/data/rauc

[keyring]
path=@@KEYRING@@

[slot.rootfs.0]
device=@@ROOT_A_DEVICE@@
type=raw
bootname=A

[slot.rootfs.1]
device=@@ROOT_B_DEVICE@@
type=raw
bootname=B
