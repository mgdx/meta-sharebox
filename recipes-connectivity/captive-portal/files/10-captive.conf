# ShareBox captive portal. The mode (SHAREBOX_CAPTIVE_MODE at build time,
# captive_mode= in /data/config/sharebox.conf at run time) is selected by
# sharebox-setup, which writes /run/sharebox/captive.conf as an include of
# /usr/share/captive-portal/popup.conf or silent.conf.
include "/run/sharebox/captive.conf"
