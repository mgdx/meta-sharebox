# Captive portal, "silent" mode (PirateBox behaviour): the known OS probes
# get the answer they expect from a network with Internet access, so no
# "sign in" window opens and clients keep the Wi-Fi. Any other request for a
# foreign host is still redirected to the home page.
#
# | Probe                                            | Answer                      |
# | */generate_204, */gen_204 (Android, Chrome,      | 204 No Content              |
# |   GrapheneOS), connectivity-check.ubuntu.com/    |                             |
# | /hotspot-detect.html, /library/test/success.html | 200 "Success" page (Apple)  |
# | /connecttest.txt, /ncsi.txt (Windows)            | 200 "Microsoft Connect Test" |
# |                                                  |   / "Microsoft NCSI"        |
# | /canonical.html, /success.txt (Firefox)          | 200 Mozilla answers         |
# | /check_network_status.txt (nmcheck.gnome.org)    | "NetworkManager is online"  |
# | networkcheck.kde.org/, /static/hotspot.txt       | "OK"                        |
$HTTP["host"] !~ var.sharebox_host_regex {
    server.document-root = "/usr/share/captive-portal/probes"
    setenv.set-response-header = (
        "Cache-Control" => "no-store",
        "X-Content-Type-Options" => "nosniff",
    )
    url.rewrite-once = (
        "^/(generate_204|gen_204)(\?.*)?$" => "/204.cgi",
        "^/(hotspot-detect\.html|library/test/success\.html)(\?.*)?$" => "/hotspot-detect.html",
        "^/connecttest\.txt(\?.*)?$" => "/connecttest.txt",
        "^/ncsi\.txt(\?.*)?$" => "/ncsi.txt",
        "^/canonical\.html(\?.*)?$" => "/canonical.html",
        "^/success\.txt(\?.*)?$" => "/success.txt",
        "^/check_network_status\.txt(\?.*)?$" => "/nm.txt",
        "^/static/hotspot\.txt(\?.*)?$" => "/fedora.txt",
    )
    $HTTP["host"] =~ "(?i)^networkcheck\.kde\.org\.?(:[0-9]+)?$" {
        url.rewrite-once = ( "^/(\?.*)?$" => "/kde.txt" )
    }
    $HTTP["host"] =~ "(?i)^connectivity-check\.ubuntu\.com\.?(:[0-9]+)?$" {
        url.rewrite-once = ( "^/(\?.*)?$" => "/204.cgi" )
    }
    # Conditions are evaluated again on the rewritten URL
    $HTTP["url"] !~ "^/(204\.cgi|hotspot-detect\.html|connecttest\.txt|ncsi\.txt|canonical\.html|success\.txt|nm\.txt|kde\.txt|fedora\.txt)$" {
        url.redirect = ( "^" => "http://" + var.sharebox_hostname + "/" )
        url.redirect-code = 302
    }
    $HTTP["url"] == "/204.cgi" {
        cgi.assign = ( ".cgi" => "" )
        cgi.execute-x-only = "enable"
    }
}
