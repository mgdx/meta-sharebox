# Captive portal, "popup" mode: any HTTP request for another host than the
# box (name or address) is redirected to the home page. Every OS probe
# (Android/Chrome generate_204, Apple hotspot-detect, Windows connecttest,
# Firefox canonical/success, NetworkManager, KDE, Ubuntu...) then sees a 302
# and opens the "sign in to network" window.
$HTTP["host"] !~ var.sharebox_host_regex {
    url.redirect = ( "^" => "http://" + var.sharebox_hostname + "/" )
    url.redirect-code = 302
    setenv.set-response-header = (
        "Cache-Control" => "no-store",
        "X-Content-Type-Options" => "nosniff",
    )
}
